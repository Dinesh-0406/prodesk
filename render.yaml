# ProDesk Production Blueprint for Render (https://render.com)
# Automatically sets up:
# 1. Managed PostgreSQL database (prodesk-db)
# 2. Managed Key-Value store (prodesk-redis)
# 3. Docker Web Service for FastAPI Backend (prodesk-api) with automated migrations & seeding

databases:
  - name: prodesk-db
    databaseName: prodesk
    user: prodesk
    plan: free

services:
  # ---------------------------------------------------------------------------
  # 1. Managed Key-Value / Valkey Store (Redis-compatible)
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: prodesk-redis
    plan: free
    ipAllowList: [] # internal network only

  # ---------------------------------------------------------------------------
  # 2. ProDesk FastAPI Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: prodesk-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "1"
      - key: SEED_DEMO_DATA
        value: "1"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: 7QlaXEQzdVICMsCXdNho-kPfs8-mEY9Ng4uWv6jW0jY=
      - key: DATABASE_URL
        fromDatabase:
          name: prodesk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prodesk-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://prodesk-ca.vercel.app,https://prodesk-firm.vercel.app,https://frontend-theta-gold-89.vercel.app"
      - key: FRONTEND_URL
        value: "https://prodesk-ca.vercel.app"
      - key: PUBLIC_API_URL # Meta downloads WhatsApp document files from this host
        value: "https://prodesk-api.onrender.com"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: AI_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: console
