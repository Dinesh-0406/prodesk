# Local development stack. Runs entirely on mock providers — no external credentials needed.
#   docker compose up --build
# App: http://localhost:8080  ·  API docs: http://localhost:8000/docs
name: prodesk

x-backend-env: &backend-env
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://prodesk:prodesk@postgres:5432/prodesk
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_PATH: /app/storage
    PUBLIC_API_URL: http://localhost:8080
    FRONTEND_URL: http://localhost:8080
    CORS_ORIGINS: http://localhost:8080,http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prodesk
      POSTGRES_PASSWORD: prodesk
      POSTGRES_DB: prodesk
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodesk -d prodesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: { context: ./backend, target: base }
    env_file:
      - path: .env
        required: false
    command: ["api"]
    environment:
      DATABASE_URL: postgresql+psycopg://prodesk:prodesk@postgres:5432/prodesk
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PUBLIC_API_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      RUN_MIGRATIONS: "1"
      SEED_DEMO_DATA: "1"
      WEB_CONCURRENCY: "2"
    volumes: [storage:/app/storage]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ./backend, target: base }
    <<: *backend-env
    command: ["worker"]
    volumes: [storage:/app/storage]
    depends_on:
      backend: { condition: service_healthy }

  beat:
    build: { context: ./backend, target: base }
    <<: *backend-env
    command: ["beat"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
