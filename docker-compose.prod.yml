# Production-oriented compose file (single host or as a template for ECS/other orchestrators).
# Uses MANAGED PostgreSQL, Redis and S3 supplied via environment — no database containers.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Put a TLS-terminating load balancer / reverse proxy (ALB, Caddy, Nginx) in front of `frontend`.
name: prodesk-prod

x-app: &app
  build: { context: ./backend, target: base }
  env_file: .env.production
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  backend:
    <<: *app
    command: ["api"]
    environment:
      WEB_CONCURRENCY: "4"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *app
    command: ["beat"]
    deploy: { replicas: 1 }  # exactly one scheduler
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    build: { context: ./frontend }
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["80:80"]
    depends_on: [backend]
